[project]
name = "regen-engine"
version = "0.3.0"
description = "Open-source job-hunting engine: source-first discovery, truthful resume tailoring, fast ATS apply, agentic memory and feedback loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["playwright>=1.45", "reportlab>=4.0", "pypdf>=4.0"]

[project.optional-dependencies]
memory = ["neo4j>=5.0", "psycopg[binary]>=3.1"]

[project.scripts]
regen = "engine.__main__:main"

[tool.setuptools.packages.find]
include = ["engine*"]

# Render Blueprint: the live public face of the engine.
# A Next.js web service (apps/web) in public mode. It never sees personal data: it reads only the anonymized feed the
# engine publishes to the gh-pages branch (`python -m engine site --push`), through a 30-second cached route.
services:
  - type: web
    runtime: node
    name: regen-engine
    plan: free
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start:public
    healthCheckPath: /api/public
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_REGEN_MODE
        value: public
      - key: REGEN_FEED_URL
        value: https://sameernagar-hub.github.io/regen-engine/replay.json
      - key: NODE_VERSION
        value: "22"

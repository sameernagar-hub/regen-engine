# Applier workers: capacity = number of replicas. Each claims batches from workspace/batches/inbox.
#   docker compose -f deploy/appliers.compose.yml up -d --build --scale applier=4
#   docker compose -f deploy/appliers.compose.yml logs -f applier
# Stop after the current batch: create workspace/batches/STOP (or `docker compose ... down`).
services:
  applier:
    build:
      context: ..
      dockerfile: deploy/applier.Dockerfile
    image: regen-applier:local
    restart: unless-stopped
    shm_size: "1gb"           # Chromium needs more than Docker's 64 MB /dev/shm
    environment:
      REGEN_TABS: "${REGEN_TABS:-3}"
      REGEN_MAX_PER_DAY: "${REGEN_MAX_PER_DAY:-60}"
    volumes:
      - ../profile:/data/profile:ro      # read-only: workers never change your Fact Bank or presets
      - ../workspace:/data/workspace     # shared queue, batches, logs, codes, events
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2g }

  # The central engine, also in a container: discovery -> prune -> select -> tailor, then it drops batch parts into
  # workspace/batches/inbox for the applier workers above. No browser here. Parts = number of applier replicas.
  pipeline:
    image: regen-applier:local
    restart: unless-stopped
    depends_on: [applier]
    environment:
      REGEN_APPLIERS: docker
      REGEN_SKIP_ATS: "${REGEN_SKIP_ATS:-workable}"
      REGEN_MAX_PER_DAY: "${REGEN_MAX_PER_DAY:-60}"
    command: ["run", "--days", "1", "--max", "${REGEN_MAX:-100}", "--appliers", "${REGEN_PARTS:-5}", "--loop", "10"]
    volumes:
      - ../profile:/data/profile:ro
      - ../workspace:/data/workspace

# The bank: your data lives in Docker named volumes instead of local folders.
#   regen-profile    Fact Bank, presets, answers, priority lists (the knowledge)
#   regen-workspace  the ledger: events.jsonl, queue, resumes, proof, codes, logs
#   regen-db         Postgres copy of the ledger (labeled tables/views; events.jsonl stays the source of truth)
# Postgres password: a git-ignored file next to .env, created once:
#   python -c "import secrets; print(secrets.token_urlsafe(24))" > .pg_password
#   query it: docker exec -it deploy-postgres-1 psql -U regen   (or 127.0.0.1:5433 from this machine)
# Every service mounts the volumes, never a host folder. Seed once from local folders:
#   docker compose -f deploy/bank.compose.yml run --rm seed
# Run:  REGEN_MAX_PER_DAY=150 REGEN_TABS=4 docker compose -f deploy/bank.compose.yml up -d --scale applier=7
#       (7 = REGEN_MAX_APPLIERS: the supervisor keeps only as many running as the backlog needs)
# Back up (do this before any `docker volume prune`):
#   docker run --rm -v regen-profile:/p -v "$PWD":/b alpine tar czf /b/regen-profile.tgz -C /p .
x-engine: &engine
  image: regen-applier:local
  restart: unless-stopped
  volumes:
    - regen-profile:/data/profile
    - regen-workspace:/data/workspace

services:
  seed:  # one-off: copy local profile/ and workspace/ into the volumes (no deletes)
    image: regen-applier:local
    profiles: ["seed"]
    user: root
    entrypoint: ["sh", "-c", "cp -a /src/profile/. /data/profile/ && cp -a /src/workspace/. /data/workspace/ && chown -R 10001 /data && echo seeded"]
    volumes:
      - ../profile:/src/profile:ro
      - ../workspace:/src/workspace:ro
      - regen-profile:/data/profile
      - regen-workspace:/data/workspace

  applier:
    <<: *engine
    build: { context: .., dockerfile: deploy/applier.Dockerfile }
    shm_size: "1gb"
    environment:
      REGEN_TABS: "${REGEN_TABS:-3}"
      REGEN_MAX_PER_DAY: "${REGEN_MAX_PER_DAY:-60}"
    deploy: { resources: { limits: { cpus: "1.5", memory: 2g } } }

  pipeline:
    <<: *engine
    depends_on: [applier]
    environment:
      REGEN_APPLIERS: docker
      REGEN_SKIP_ATS: "${REGEN_SKIP_ATS:-workable}"
      REGEN_MAX_PER_DAY: "${REGEN_MAX_PER_DAY:-60}"
      REGEN_ASHBY_PER_PASS: "${REGEN_ASHBY_PER_PASS:-1}"  # Ashby bot-checks bursts; a flag pauses Ashby 24 h on its own
      REGEN_SOURCES_EVERY: "${REGEN_SOURCES_EVERY:-6}"    # loop passes between new-grad + GitHub list pulls
    command: ["run", "--days", "1", "--max", "${REGEN_MAX:-100}", "--appliers", "${REGEN_PARTS:-5}", "--loop", "${REGEN_LOOP_MIN:-5}"]

  relay:  # email codes from the Gmail tab land straight in the bank
    <<: *engine
    environment: { REGEN_RELAY_HOST: "0.0.0.0" }
    entrypoint: ["python", "-m", "engine"]
    command: ["relay", "8799"]
    ports: ["127.0.0.1:8799:8799"]

  supervisor:  # the container on top: autoscales appliers to the backlog, requeues lost claims, IMAP codes
    <<: *engine
    user: root  # the Docker socket is root-owned; this is the only service that gets it
    env_file:  # REGEN_SMTP_USER + REGEN_SMTP_APP_PASSWORD (Gmail app password) -> hands-free IMAP codes
      - { path: ../.env, required: false }
    environment:
      REGEN_MIN_APPLIERS: "${REGEN_MIN_APPLIERS:-1}"
      REGEN_MAX_APPLIERS: "${REGEN_MAX_APPLIERS:-7}"
      REGEN_COMPOSE_PROJECT: deploy
    entrypoint: ["python", "-m", "engine"]
    command: ["supervise"]
    volumes:
      - regen-profile:/data/profile
      - regen-workspace:/data/workspace
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:  # the ledger as SQL: 127.0.0.1 only, password from the .pg_password secret, never in an env var
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: regen
      POSTGRES_DB: regen
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    ports: ["127.0.0.1:5433:5432"]
    volumes: [regen-db:/var/lib/postgresql]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U regen"], interval: 5s, retries: 20 }
    deploy: { resources: { limits: { memory: 384m } } }

  ledger:  # copies new events.jsonl lines + fleet heartbeats into Postgres every 2 s (append-only, idempotent; only new bytes)
    <<: *engine
    entrypoint: ["python", "-m", "apps.api.migrate"]
    command: ["--loop", "2"]
    environment: { REGEN_DB_HOST: postgres }
    secrets: [pg_password]
    depends_on: { postgres: { condition: service_healthy } }

  mcp:  # MCP over HTTP into the live bank: http://127.0.0.1:8790/mcp (fleet, ledger, API views, answers, repo)
    <<: *engine
    entrypoint: ["python", "-m", "engine"]
    command: ["mcp", "--http", "8790"]
    environment:
      REGEN_IN_BANK: "1"
      REGEN_MCP_HOST: "0.0.0.0"
      REGEN_MCP_WRITE: "${REGEN_MCP_WRITE:-0}"  # kill is always allowed; answers/scale/clear need 1
      REGEN_DB_HOST: postgres
    secrets: [pg_password]
    ports: ["127.0.0.1:8790:8790"]
    deploy: { resources: { limits: { cpus: "0.5", memory: 384m } } }

  answers:  # the answer queue: /needs answers -> profile/answers.json -> one retry batch in batches/inbox
    <<: *engine
    entrypoint: ["python", "-m", "engine"]
    command: ["answers", "--watch"]
    deploy: { resources: { limits: { cpus: "0.25", memory: 256m } } }

  api:  # the control room reads the bank: http://127.0.0.1:8787 (read-only; writes need your own machine)
    <<: *engine
    entrypoint: ["python", "-m", "uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8787"]
    ports: ["127.0.0.1:8787:8787"]
    environment:
      REGEN_DB_HOST: postgres
      REGEN_API_ANSWERS: "1"     # write 1: /needs answers, queued for the answers container
      REGEN_API_REACH: "1"       # write 2: the reach page marks a Workday/iCIMS job submitted / skipped (your own click)
      REGEN_ANSWER_QUEUE: "1"
      REGEN_API_TRUST_PORT: "1"  # published on 127.0.0.1 only: the bridge gateway is this machine
    secrets: [pg_password]
    depends_on: [ledger]

  web:  # the control room UI in a container: http://127.0.0.1:3000 (local mode; the browser calls the api container directly, CORS-scoped)
    build:
      context: ../apps/web
      dockerfile: ../../deploy/web.Dockerfile
      args: { NEXT_PUBLIC_REGEN_API: "http://127.0.0.1:8787" }  # no proxy: the browser talks to the api container
    image: regen-web:local
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    deploy: { resources: { limits: { memory: 384m } } }

  reposync:  # keeps GitHub current: feed -> gh-pages, checked local commits -> bot/sync + PR (engine/reposync.py)
    <<: *engine
    entrypoint: ["python", "-m", "engine"]
    command: ["reposync"]
    secrets: [gh_token]
    environment: { REGEN_SYNC_MIN: "${REGEN_SYNC_MIN:-15}" }
    volumes:
      - regen-profile:/data/profile
      - regen-workspace:/data/workspace
      - regen-repo:/repo
      - ..:/src:ro  # the host repo, read-only: only committed `main` is ever taken from it
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g } } }


  eval:  # one-shot benchmarks B1-B10; the supervisor creates these on a commit / schedule / request (0..REGEN_MAX_EVALS)
    <<: *engine  # by hand: docker compose -f deploy/bank.compose.yml --profile eval run --rm eval
    profiles: [eval]
    restart: "no"
    entrypoint: ["python", "-m", "engine"]
    command: ["bench", "--save", "--reason", "manual"]
    environment: { REGEN_DB_HOST: postgres, REGEN_API_URL: "http://api:8787" }
    secrets: [pg_password]
    deploy: { resources: { limits: { cpus: "1.0", memory: 1g, pids: 256 } } }

  desk:  # a visible browser you sign in to: http://127.0.0.1:6080 (noVNC, this machine only); fills Workday forms there
    <<: *engine
    entrypoint: ["sh", "-c", "rm -f /tmp/.X99-lock; Xvfb :99 -screen 0 1366x900x24 -nolisten tcp >/dev/null 2>&1 & sleep 1; x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet >/dev/null 2>&1 & websockify --web /usr/share/novnc 6080 localhost:5900 >/dev/null 2>&1 & exec python -m engine desk"]
    environment:
      REGEN_WORKDAY_SUBMIT: "${REGEN_WORKDAY_SUBMIT:-0}"  # 1 = submit when every required answer came from presets / Fact Bank
    ports: ["127.0.0.1:6080:6080"]
    volumes:
      - regen-profile:/data/profile
      - regen-workspace:/data/workspace
      - regen-desk:/home/regen/desk-profile  # your tenant sign-ins survive a recreate
    shm_size: "1gb"
    deploy: { resources: { limits: { cpus: "1.5", memory: 2g, pids: 1024 } } }

secrets:
  gh_token: { file: ../.gh_token }  # fine-grained PAT, this repo only (Contents + Pull requests: read/write)
  pg_password: { file: ../.pg_password }

volumes:
  regen-profile: { name: regen-profile }
  regen-workspace: { name: regen-workspace }
  regen-db: { name: regen-db }
  regen-repo: { name: regen-repo }
  regen-desk: { name: regen-desk }

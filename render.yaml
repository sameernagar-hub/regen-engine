# Render Blueprint: the public face of the project (static, free tier).
# It publishes site/ (built by `python -m engine site`): the live view replaying anonymized recent activity.
# No server, no secrets, no personal data; Render redeploys on every push to main.
services:
  - type: web
    runtime: static
    name: regen-engine
    branch: main
    buildCommand: echo "site/ is prebuilt and committed by python -m engine site"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /replay.json
        name: Cache-Control
        value: no-cache
